name: topophany-bar
options:
  bundleIdPrefix: io.github.whitenwhiten
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  topophany-bar:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Builds sign with the team, with the App Group the widgets share with
    # the app. TOPOPHANY_SIGN=NO builds ad hoc with no team and no
    # entitlements: the app runs, and macOS ignores the widgets.
    TOPOPHANY_SIGN: YES
    TOPOPHANY_TEAM: G4Y2R7586K
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: $(TOPOPHANY_TEAM_$(TOPOPHANY_SIGN))
    TOPOPHANY_TEAM_YES: $(TOPOPHANY_TEAM)
    TOPOPHANY_TEAM_NO: ""
    CODE_SIGN_IDENTITY: $(TOPOPHANY_IDENTITY_$(TOPOPHANY_SIGN))
    TOPOPHANY_IDENTITY_YES: Apple Development
    TOPOPHANY_IDENTITY_NO: "-"
    TOPOPHANY_APP_GROUP: $(TOPOPHANY_APP_GROUP_$(TOPOPHANY_SIGN))
    TOPOPHANY_APP_GROUP_YES: $(TOPOPHANY_TEAM).io.github.whitenwhiten.topophany-bar
    TOPOPHANY_APP_GROUP_NO: ""
    CODE_SIGN_ENTITLEMENTS: $(TOPOPHANY_ENTITLEMENTS_$(TOPOPHANY_SIGN))
    TOPOPHANY_ENTITLEMENTS_NO: ""
targets:
  topophany-bar:
    type: application
    platform: macOS
    sources:
      - path: Apps/topophany-bar
      # Every copy of the app carries the logos' licenses.
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: topophany-bar
        product: TopophanyKit
      - package: topophany-bar
        product: TopophanyEngine
      - package: topophany-bar
        product: TopophanySections
      - package: topophany-bar
        product: TopophanyThemes
      - package: topophany-bar
        product: TopophanyWidgets
      - package: topophany-bar
        product: LocalReadings
      - target: TopophanyWidgetsExtension
        embed: true
        codeSign: false
    info:
      path: Apps/topophany-bar/Info.plist
      properties:
        CFBundleDisplayName: Topophany
        CFBundleName: Topophany
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 Whiten
        TopophanyAppGroup: $(TOPOPHANY_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: io.github.whitenwhiten.topophany-bar
            CFBundleURLSchemes: [topophany-bar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whitenwhiten.topophany-bar
        PRODUCT_NAME: topophany-bar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        TOPOPHANY_ENTITLEMENTS_YES: Apps/topophany-bar/topophany-bar.entitlements
  TopophanyAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TopophanyAppTests
      - path: Apps/topophany-bar/PanelShortcutController.swift
      - path: Apps/topophany-bar/AppModel.swift
      - path: Apps/topophany-bar/PanelController.swift
      - path: Apps/topophany-bar/TerminalLauncher.swift
    dependencies:
      - package: topophany-bar
        product: TopophanyKit
      - package: topophany-bar
        product: TopophanyEngine
      - package: topophany-bar
        product: TopophanySections
      - package: topophany-bar
        product: TopophanyThemes
      - package: topophany-bar
        product: TopophanyWidgets
      - package: topophany-bar
        product: LocalReadings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whitenwhiten.topophany-bar.tests
        GENERATE_INFOPLIST_FILE: YES
  # Widgets load only when signed with a team, the App Group and the App
  # Sandbox.
  TopophanyWidgetsExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/Widgets
    dependencies:
      - package: topophany-bar
        product: TopophanyKit
      - package: topophany-bar
        product: TopophanySections
      - package: topophany-bar
        product: TopophanyThemes
      - package: topophany-bar
        product: TopophanyWidgets
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: Apps/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Topophany
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TopophanyAppGroup: $(TOPOPHANY_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whitenwhiten.topophany-bar.widgets
        PRODUCT_NAME: TopophanyWidgetsExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TOPOPHANY_ENTITLEMENTS_YES: Apps/Widgets/Widgets.entitlements
schemes:
  topophany-bar:
    build:
      targets:
        topophany-bar: all
    run:
      config: Debug
    test:
      targets:
        - TopophanyAppTests
