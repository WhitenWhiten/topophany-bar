name: topophany-bar
options:
  bundleIdPrefix: io.github.whitenwhiten
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  topophany-bar:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Local builds are ad hoc signed and need no team. Signing with a team,
    # and the App Group the widgets need, are added only when one is chosen.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    TOPOPHANY_APP_GROUP: ""
targets:
  topophany-bar:
    type: application
    platform: macOS
    sources:
      - path: Apps/topophany-bar
    dependencies:
      - package: topophany-bar
        product: TopophanyKit
      - package: topophany-bar
        product: TopophanyEngine
      - package: topophany-bar
        product: TopophanySections
      - package: topophany-bar
        product: TopophanyThemes
      - package: topophany-bar
        product: TopophanyWidgets
      - package: topophany-bar
        product: LocalReadings
      - target: TopophanyWidgetsExtension
        embed: true
        codeSign: false
    info:
      path: Apps/topophany-bar/Info.plist
      properties:
        CFBundleDisplayName: Topophany
        CFBundleName: topophany-bar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        TopophanyAppGroup: $(TOPOPHANY_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: io.github.whitenwhiten.topophany-bar
            CFBundleURLSchemes: [topophany-bar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whitenwhiten.topophany-bar
        PRODUCT_NAME: topophany-bar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  # Widgets load only when signed with a team, the App Group and the App
  # Sandbox; until then this builds ad hoc and macOS ignores it.
  TopophanyWidgetsExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/Widgets
    dependencies:
      - package: topophany-bar
        product: TopophanyKit
      - package: topophany-bar
        product: TopophanySections
      - package: topophany-bar
        product: TopophanyThemes
      - package: topophany-bar
        product: TopophanyWidgets
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: Apps/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Topophany
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TopophanyAppGroup: $(TOPOPHANY_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whitenwhiten.topophany-bar.widgets
        PRODUCT_NAME: TopophanyWidgetsExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
schemes:
  topophany-bar:
    build:
      targets:
        topophany-bar: all
    run:
      config: Debug
